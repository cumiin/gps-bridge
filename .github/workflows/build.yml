name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:   # 깃허브 Actions 탭에서 수동 실행 버튼

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: JDK 17 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 안드로이드 SDK 설정
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 디버그 APK 빌드
        run: gradle :sender:assembleDebug :receiver:assembleDebug --no-daemon

      - name: 송신 앱(폰) APK 업로드
        uses: actions/upload-artifact@v4
        with:
          name: sender-phone-apk
          path: sender/build/outputs/apk/debug/*.apk

      - name: 수신 앱(태블릿) APK 업로드
        uses: actions/upload-artifact@v4
        with:
          name: receiver-tablet-apk
          path: receiver/build/outputs/apk/debug/*.apk
